<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Neon | Jerarquía de memoria</title>
<style>
:root{
  --bg:#080817; --panel:#11132b; --cyan:#00f5ff; --pink:#ff2bd6;
  --purple:#9b5cff; --green:#39ff88; --text:#f4f4ff; --muted:#b9bad2;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; padding:28px 16px; color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at 15% 10%,#24205b 0,transparent 32%),
             radial-gradient(circle at 90% 85%,#401044 0,transparent 30%),var(--bg);
}
.container{max-width:850px;margin:auto}
header{text-align:center;margin:10px 0 26px}
h1{font-size:clamp(2rem,5vw,3.2rem);margin:0 0 10px;color:var(--cyan);
   text-shadow:0 0 8px var(--cyan),0 0 22px #007bff}
header p{color:var(--muted);line-height:1.5}
.card{
  background:rgba(17,19,43,.94); border:1px solid var(--purple);
  border-radius:20px;padding:clamp(20px,4vw,34px);
  box-shadow:0 0 12px #9b5cff55,0 0 35px #ff2bd622;
}
.topline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  color:var(--cyan);font-weight:bold;margin-bottom:15px}
.progress{height:9px;background:#292944;border-radius:20px;overflow:hidden;margin-bottom:25px}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:.3s}
#question{font-size:1.25rem;line-height:1.5;margin:0 0 22px}
.answers{display:grid;gap:12px}
.answer{
  width:100%;text-align:left;padding:15px 17px;border-radius:12px;
  border:1px solid #55527b;background:#191b39;color:var(--text);
  font-size:1rem;cursor:pointer;transition:.2s
}
.answer:hover:not(:disabled){border-color:var(--cyan);box-shadow:0 0 12px #00f5ff66;transform:translateY(-2px)}
.answer:disabled{cursor:default;opacity:1}
.answer.correct{border-color:var(--green);background:#123729;box-shadow:0 0 12px #39ff8866}
.answer.wrong{border-color:var(--pink);background:#3a1738;box-shadow:0 0 12px #ff2bd666}
#feedback{min-height:48px;margin:18px 0 4px;color:var(--muted);line-height:1.5}
button.primary{
  border:0;border-radius:30px;padding:13px 25px;font-weight:bold;font-size:1rem;
  color:#080817;background:linear-gradient(90deg,var(--cyan),var(--pink));
  cursor:pointer;box-shadow:0 0 15px #00f5ff66
}
button.primary:disabled{opacity:.35;cursor:not-allowed}
.actions{display:flex;justify-content:flex-end;margin-top:15px}
#result{text-align:center}
#result h2{color:var(--pink);font-size:2rem;text-shadow:0 0 12px var(--pink)}
.score{font-size:3.5rem;color:var(--green);text-shadow:0 0 15px var(--green);margin:12px}
.small{color:var(--muted);line-height:1.6}
.hidden{display:none}
@media(max-width:520px){.topline{font-size:.9rem}#question{font-size:1.1rem}}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>QUIZ NEON</h1>
    <p>Jerarquía de memoria y componentes de almacenamiento<br>Demuestra lo que aprendiste.</p>
  </header>

  <main class="card" id="quiz">
    <div class="topline">
      <span id="counter">Pregunta 1 de 10</span>
      <span id="points">Puntos: 0</span>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <h2 id="question"></h2>
    <div class="answers" id="answers"></div>
    <p id="feedback" aria-live="polite"></p>
    <div class="actions"><button class="primary" id="next" disabled>Siguiente</button></div>
  </main>

  <section class="card hidden" id="result">
    <h2>¡Quiz terminado!</h2>
    <div class="score" id="finalScore">0/10</div>
    <p id="message" class="small"></p>
    <button class="primary" onclick="restart()">Volver a jugar</button>
  </section>
</div>

<script>
const questions = [
 {q:"¿Cuál es el objetivo principal de la jerarquía de memoria?",
  a:["Aumentar el tamaño del procesador","Permitir que el procesador acceda rápidamente a los datos que necesita","Eliminar la memoria RAM","Guardar todos los datos únicamente en caché"],c:1,
  why:"La jerarquía organiza los distintos tipos de memoria para que el procesador obtenga rápidamente la información necesaria."},
 {q:"¿Qué característica suele tener la memoria más cercana al procesador?",
  a:["Mayor velocidad y menor capacidad","Menor velocidad y mayor capacidad","Mayor capacidad y menor costo siempre","Almacenamiento permanente"],c:0,
  why:"En general, cuanto más cerca está una memoria del procesador, mayor es su velocidad y menor su capacidad."},
 {q:"¿Dónde se encuentran los registros?",
  a:["Dentro del disco duro","En la memoria secundaria","Dentro del procesador o CPU","En una tarjeta SD"],c:2,
  why:"Los registros son pequeñas unidades de almacenamiento ubicadas directamente dentro del procesador."},
 {q:"¿Cuál es la función del contador de programa (PC)?",
  a:["Guardar fotografías","Mantener la dirección de memoria de la siguiente instrucción que debe ejecutarse","Actualizar los datos de la DRAM","Controlar la capacidad del SSD"],c:1,
  why:"El contador de programa conserva la dirección de memoria de la siguiente instrucción que debe ejecutarse."},
 {q:"¿Qué es la memoria caché?",
  a:["Un almacenamiento permanente de archivos","Una memoria de alta velocidad que guarda temporalmente datos e instrucciones frecuentes","Un tipo de disco óptico","Una memoria externa que sustituye al HDD"],c:1,
  why:"La caché almacena temporalmente datos e instrucciones que el procesador utiliza con frecuencia para reducir tiempos de espera."},
 {q:"¿Cuál es el orden de los niveles de caché desde el más cercano al núcleo del procesador?",
  a:["L3, L2, L1","L2, L1, L3","L1, L2, L3","RAM, L3, L1"],c:2,
  why:"La caché L1 es la más cercana y normalmente la más rápida; después se encuentran L2 y L3."},
 {q:"¿Qué significa RAM?",
  a:["Read Access Machine","Random Access Memory","Rapid Active Memory","Remote Allocation Module"],c:1,
  why:"RAM corresponde a Random Access Memory, conocida en español como memoria de acceso aleatorio."},
 {q:"¿Qué diferencia a la DRAM de la SRAM según la investigación?",
  a:["La DRAM necesita actualización periódica; la SRAM no","La SRAM necesita actualización periódica; la DRAM no","Ambas son memorias permanentes","La DRAM es siempre más rápida y costosa que la SRAM"],c:0,
  why:"La DRAM utiliza capacitores que requieren actualización periódica; la SRAM no necesita ese proceso, pero tiene mayor costo y ocupa más espacio por bit."},
 {q:"¿Qué característica distingue a los dispositivos de almacenamiento secundario, como SSD y HDD?",
  a:["Pierden los datos al apagar el equipo","Se encuentran dentro de los registros de la CPU","Conservan la información sin recibir energía eléctrica constantemente","Solo almacenan instrucciones temporales"],c:2,
  why:"El SSD y el HDD son dispositivos no volátiles: mantienen la información aunque el equipo esté apagado."},
 {q:"De acuerdo con la comparación de la investigación, ¿cuál afirmación sobre SSD y HDD es correcta?",
  a:["El HDD suele ser más rápido que el SSD","El SSD suele ofrecer mayor velocidad que el HDD","El SSD tiene menor capacidad en todos los casos","El HDD utiliza memoria caché para conservar archivos"],c:1,
  why:"La investigación señala que el SSD ofrece velocidades de acceso superiores, mientras que el HDD suele ser más lento y permite almacenar grandes cantidades a bajo costo."}
];

let current=0, score=0, locked=false;
const questionEl=document.getElementById("question");
const answersEl=document.getElementById("answers");
const feedbackEl=document.getElementById("feedback");
const nextBtn=document.getElementById("next");

function renderQuestion(){
  locked=false;
  const item=questions[current];
  document.getElementById("counter").textContent=`Pregunta ${current+1} de ${questions.length}`;
  document.getElementById("points").textContent=`Puntos: ${score}`;
  document.getElementById("bar").style.width=`${(current/questions.length)*100}%`;
  questionEl.textContent=item.q;
  answersEl.innerHTML="";
  feedbackEl.textContent="";
  nextBtn.disabled=true;
  item.a.forEach((option,index)=>{
    const btn=document.createElement("button");
    btn.className="answer";
    btn.textContent=String.fromCharCode(65+index)+". "+option;
    btn.onclick=()=>selectAnswer(index,btn);
    answersEl.appendChild(btn);
  });
}
function selectAnswer(index,chosen){
  if(locked)return;
  locked=true;
  const item=questions[current];
  const buttons=[...answersEl.children];
  buttons.forEach((btn,i)=>{
    btn.disabled=true;
    if(i===item.c)btn.classList.add("correct");
  });
  if(index===item.c){
    score++;
    feedbackEl.textContent="¡Correcto! "+item.why;
  }else{
    chosen.classList.add("wrong");
    feedbackEl.textContent="No es correcto. "+item.why;
  }
  document.getElementById("points").textContent=`Puntos: ${score}`;
  nextBtn.disabled=false;
  nextBtn.textContent=current===questions.length-1?"Ver resultado":"Siguiente";
}
nextBtn.addEventListener("click",()=>{
  if(!locked)return;
  current++;
  if(current<questions.length)renderQuestion();
  else showResult();
});
function showResult(){
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("finalScore").textContent=`${score}/${questions.length}`;
  const pct=score/questions.length*100;
  document.getElementById("message").textContent=
    pct===100?"¡Excelente! Dominas los conceptos de la investigación.":
    pct>=70?"¡Muy bien! Tienes un buen conocimiento del tema.":
    pct>=50?"Buen intento. Repasa los conceptos y vuelve a intentarlo.":
    "Te recomendamos repasar la investigación y realizar el quiz nuevamente.";
  document.getElementById("bar").style.width="100%";
}
function restart(){
  current=0;score=0;
  document.getElementById("result").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  renderQuestion();
}
renderQuestion();
</script>
</body>
</html>
